spring:
  application:
    name: CHURAI-BE

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/churai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:churai1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100

  jackson:
    serialization:
      fail-on-empty-beans: false
    time-zone: Asia/Seoul

jwt:
  # 로컬 개발용 기본값입니다. 운영 환경에서는 반드시 JWT_SECRET(32바이트 이상)을 지정하세요.
  secret: ${JWT_SECRET:churai-local-dev-jwt-secret-key-change-me-0123456789}
  # 액세스 토큰 만료 시간(ms), 기본 1시간
  expiration: ${JWT_EXPIRATION:3600000}

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    org.hibernate.SQL: debug
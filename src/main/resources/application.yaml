spring:
  application:
    name: CHURAI-BE

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/churai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:churai1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100

  servlet:
    multipart:
      # 이미지 1장당 5MB, 게시글 1건당 최대 3장
      max-file-size: 5MB
      max-request-size: 20MB

  jackson:
    serialization:
      fail-on-empty-beans: false
    time-zone: Asia/Seoul

jwt:
  # 로컬 개발용 기본값입니다.
  # 운영 환경에서는 반드시 JWT_SECRET을 별도로 설정하세요.
  secret: ${JWT_SECRET:churai-local-dev-jwt-secret-key-change-me-0123456789}
  expiration: ${JWT_EXPIRATION:3600000}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME:}
      endpoint: ${AWS_S3_ENDPOINT:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

logging:
  level:
    org.hibernate.SQL: debug

# ==============================
# Gemini AI Recommendation
# ==============================
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}